name: Validate and deploy Figure Atlas
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/validate_catalog.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check assets/app.js
      - uses: actions/configure-pages@v5
      - name: Assemble public site
        run: |
          mkdir _site
          cp index.html .nojekyll robots.txt sitemap.xml _site/
          cp -r assets data images docs _site/
          cp LICENSE IMAGES_POLICY.md NOTICE.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
